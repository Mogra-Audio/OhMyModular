name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches plugin.json
        run: |
          version="$(jq -r .version plugin.json)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "plugin.json version is 'v${version}', tag is '${GITHUB_REF_NAME}'" >&2
            exit 1
          fi

  build:
    needs: verify
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t files < <(find artifacts -type f -name '*.vcvplugin' | sort)
          if [ "${#files[@]}" -ne 4 ]; then
            echo "Expected 4 platform artifacts, found ${#files[@]}" >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
              --title "OhMyModular ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
